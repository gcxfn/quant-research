[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-quant-research"
version = "0.1.0"
description = "Offline, auditable daily strategy research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars>=1.30,<2",
  "pyarrow>=18,<26",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "vectorbt>=0.28,<0.29",
  "backtrader==1.9.78.123",
  "psutil>=6,<8",
  "plotly>=5.19,<6",
  "rqalpha>=6.3.0",
  "lightgbm==4.7.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
quant = "quant.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]
# editable .pth must survive mbcs-decoding on Windows under a non-ASCII repo path
core-metadata-version = "2.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# .venv is non-editable: a Chinese repo path makes editable .pth files fail on Windows (mbcs decode)
[tool.uv]
package = true
